name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.8.0"
            helpers: "0.13.354"
          - homeassistant: "2026.8.1"
            helpers: "0.13.355"
          - homeassistant: "2026.10.4"
            helpers: "0.13.375"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: >-
          pip install -e .
          'homeassistant==${{ matrix.homeassistant }}'
          'pytest-homeassistant-custom-component==${{ matrix.helpers }}'
          'ruff==0.17.5'
      - run: ruff check .
      - run: pytest
